name: orc-cycle

# Free 24/7 compute.  On a PUBLIC repository GitHub-hosted runner minutes are
# unmetered, so this can run around the clock without a bill and without the
# workstation being switched on.  The 6-hour job ceiling is why the schedule
# re-fires every 6 hours rather than running one long job.
#
# The runner receives only the development panel: the bundle it downloads was
# truncated at the holdout seal before it was ever published.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      hypotheses:
        description: "Space-separated hypothesis ids, blank for the queue"
        required: false
        default: ""
      rerun_all:
        description: "Re-run every registered hypothesis"
        type: boolean
        default: false

permissions:
  contents: write
  # An issue is the only channel that reaches a phone with no new service, no
  # secret and no bill: GitHub already notifies the owner by email and through
  # its app. The local notifier raises a desktop toast and appends to
  # logs/NEWS.md, both invisible while the workstation is asleep -- which is
  # most of the time, and exactly when an unattended loop needs to speak.
  issues: write

concurrency:
  group: orc-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch the development panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download panel-latest --pattern "orc-panel.tar.gz" --clobber
          gh release download panel-latest --pattern "orc-panel.sha256" --clobber || true
          if [ -f orc-panel.sha256 ]; then sha256sum -c orc-panel.sha256; fi
          tar xzf orc-panel.tar.gz
          python - <<'PY'
          import json, sys, pathlib
          m = json.loads(pathlib.Path("facts/MANIFEST.json").read_text())
          assert m["contains_sealed_data"] is False, "bundle claims to carry sealed data"
          print(f"panel: {len(m['symbols'])} symbols, sealed from {m['holdout_start']}")
          PY

      - name: Refuse to run against sealed data
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          import polars as pl, pathlib
          from orc import config, holdout
          bad = []
          for p in pathlib.Path("facts/panel_1h").glob("*.parquet"):
              try:
                  holdout.assert_development_only(pl.read_parquet(p))
              except holdout.HoldoutViolation as e:
                  bad.append(f"{p.name}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("holdout seal verified on every panel file")
          PY

      - name: Kernel test suite
        run: python -m pytest tests -q

      - name: Research cycle
        id: cycle
        env:
          # The runner is 4 cores where the workstation is 24, and a pool wider
          # than the machine is slower, not faster. The search test reads this.
          ORC_WORKERS: "4"
        run: |
          python scripts/daily_cycle.py \
            ${{ github.event.inputs.rerun_all == 'true' && '--all' || '' }} \
            ${{ github.event.inputs.hypotheses }}

      # The cycle used to take 35 minutes and now takes about three, which made
      # the idle problem WORSE rather than better: the schedule fires every six
      # hours, so the runner was working for 3 minutes and standing down for 5
      # hours and 57. The waste is not the point -- runner minutes are unmetered
      # on a public repository. The point is that a hypothesis registered a
      # minute after a cycle waited most of six hours for anything to evaluate
      # it, and section 9 calls that the one kind of idling that has already
      # been paid for, because registering it already cost N.
      #
      # So the supervisor stays resident for the rest of the window and asks
      # runstate.next_action() every tick, exactly as it does on the
      # workstation. `reason`, `scout` and `kernel_review` are skipped because
      # they need a model provider this runner does not have -- and because the
      # registration budget belongs to one supervisor. Two of them reading it
      # independently is how four registrations become six.
      # Immediately, not at the end of the job.
      #
      # The cycle finishes in the first few minutes and the step below then
      # holds the machine for five hours. On 2026-09-04 H0017's ninety rows
      # were computed at 07:07Z and would have reached the repository at about
      # 12:00Z: five hours in which the question was answered, `orc.target`
      # still reported the old N, and the local tree still showed H0017 waiting
      # in a queue that had already been consumed. The results are what the job
      # exists to produce, so they leave as soon as they exist; the same script
      # runs again at the end for whatever the window itself produced.
      - name: Land the cycle's results now
        run: python scripts/commit_results.py

      - name: Keep working for the rest of the window
        if: steps.cycle.outcome == 'success'
        env:
          ORC_WORKERS: "4"
        run: |
          set -uo pipefail
          # The merge policy and the committer identity, from the one
          # place that defines them. forever.py's land() commits and
          # pushes inside this window, so a rebase can happen here.
          python scripts/commit_results.py --configure-only
          # 300 of the job's 350 minutes, leaving room for the commit, the
          # notification and the artifact upload, and finishing before the next
          # schedule fires.
          python scripts/forever.py --until-minutes 300 \
            --skip reason,scout,kernel_review || true

      - name: Commit results
        run: python scripts/commit_results.py

      # Runs whatever the cycle did, refusing included. A blocked cycle is the
      # most important thing to be told about: the loop has stopped itself and
      # stays stopped, every six hours, until a human fixes the finding or
      # records a decision -- findings.py keeps that manual on purpose.
      - name: Say something, wherever the workstation is
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ steps.cycle.outcome }}" = "success" ]; then
            python scripts/notify_issue.py > /tmp/orc_msg.txt || exit 0
          else
            python scripts/notify_issue.py --blocked > /tmp/orc_msg.txt || exit 0
          fi
          title=$(head -1 /tmp/orc_msg.txt)
          sed -n '3,$p' /tmp/orc_msg.txt > /tmp/orc_body.md
          # One rolling issue, not a new one every six hours: a loop that files
          # four issues a day is a loop nobody reads.
          n=$(gh issue list --label orc-notify --state open --limit 1                 --json number --jq '.[0].number // empty' || true)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file /tmp/orc_body.md
            gh issue edit "$n" --title "$title"
          else
            gh label create orc-notify --color ededed               --description "the loop talking" 2>/dev/null || true
            gh issue create --title "$title" --body-file /tmp/orc_body.md               --label orc-notify
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orc-reports-${{ github.run_id }}
          path: |
            reports/
            ledger/trials.sqlite
          retention-days: 30

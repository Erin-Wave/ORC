name: orc-guard

# The gate the workstation's git hooks cannot be trusted to have run.
#
# scripts/precommit.py enforces the suite and orc/guard.py enforces that the
# ORACLE is not quietly loosened -- a deleted test, a new skip, a frozen
# threshold rewritten, the holdout ceiling raised. Both live in local hooks,
# and a local hook is a request: `git commit --no-verify` skips it, a fresh
# checkout does not have it installed until someone runs --install, and the
# GitHub worker has never had one at all. Every push from the 24-hour
# supervisor therefore reached the remote on the strength of a check nobody
# could confirm had run.
#
# This runs the identical code on the identical commit, on a machine the agent
# does not control. It cannot block the push -- the commit already exists -- so
# what it buys is that a bypass is LOUD: a red run on the default branch, in
# health.py's task list, next to the cycle.
#
# It never registers a hypothesis, never opens the holdout, and never writes to
# the repository. Read-only permissions, and nothing here can add a row to N.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orc-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The gate reads the diff of the pushed commit against its parent, so it
      # needs the parent. A shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      - name: The suite must be green
        run: python -m pytest tests -q

      # The Track B evaluator has had ONE implementation since it was written
      # and every Track B number the project reports comes out of it. Section 5
      # gives Track A two that check each other and says what a disagreement
      # means: every result is void. oracle/ref_signal.py is the second one,
      # written by codex from semantics alone so that a defect has to be a
      # mistake BOTH vendors make.
      #
      # It runs here rather than only on the workstation because this is the
      # machine the agent does not control -- the same reason the suite runs
      # here. `continue-on-error` while the first disagreements are still being
      # triaged: two are classified and one of those is a specification gap
      # rather than a defect in either implementation, so a hard failure today
      # would block every commit on a question nobody has decided yet.
      - name: Do the two Track B evaluators agree?
        continue-on-error: true
        run: python oracle/fuzz.py --cases 400

      # Types are the only check here that makes a defect UNREPRESENTABLE
      # rather than detectable. Scoped to the kernel and the evaluators because
      # that is where a wrong number comes from, and advisory while the
      # annotations are still being added.
      - name: Types, where a wrong number would come from
        continue-on-error: true
        run: |
          pip install --quiet mypy
          python -m mypy --ignore-missing-imports orc/kernel orc/eval || true


      # Mutation testing is the only check here that measures the CHECKS: it
      # breaks the kernel on purpose and asks whether any test notices. Three
      # of ten deliberate defects passed a green 248-test suite the day it was
      # written, including deleting the holdout truncation from panel.load.
      #
      # UNCONDITIONAL, and that is a correction. It used to run only when
      # `git diff --name-only HEAD~1 HEAD` named a file under orc/ or tests/,
      # and run 33845845287 went GREEN in 32 seconds while printing "no kernel
      # or test file changed" for a commit that changed orc/guard.py and
      # tests/test_protocol.py. The step above had already done `git reset
      # --soft HEAD~1`, so HEAD was one commit back and the diff compared the
      # wrong pair. A green run that quietly measured nothing is the exact
      # failure this whole gate exists to catch, so the branch that could lie
      # is gone rather than fixed: on a public repository the four minutes are
      # unmetered, and `cancel-in-progress` means a burst of pushes costs one
      # run, not one per commit.
      #
      # This runner has no facts/ archive. Every test is now portable enough to
      # pass without one, so the baseline is expected to be fully green here --
      # if the harness reports deselections, that is itself worth reading. A
      # SURVIVOR must still be reproduced locally with
      # `python scripts/mutation.py --only <id>` before it is believed.
      - name: Do the tests actually catch anything?
        if: github.event_name != 'pull_request'
        run: python scripts/mutation.py

      # LAST, because it is the only step that moves HEAD. `git reset --soft
      # HEAD~1` puts the pushed commit's changes back in the index, which is
      # exactly the state the local hook reads, and then the same function
      # judges the same diff against the same message. HEAD is restored either
      # way so that a step added after this one cannot inherit a moved HEAD --
      # which is how the mutation gate above came to skip itself.
      #
      # A push of several commits is judged on its tip. The gate is a net under
      # an unattended agent, not a proof about every commit in history.
      - name: Was the oracle loosened without saying so?
        if: github.event_name == 'push'
        run: |
          set -uo pipefail
          git log -1 --pretty=%B > /tmp/orc_commit_msg.txt
          echo "--- the message this commit was made with ---"
          cat /tmp/orc_commit_msg.txt
          echo "---"
          tip=$(git rev-parse HEAD)
          git reset --soft HEAD~1
          python scripts/precommit.py --message /tmp/orc_commit_msg.txt
          rc=$?
          git reset --soft "$tip"
          exit $rc
